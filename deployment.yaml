apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myhello
  template:
    metadata:
      labels:
        app: myhello
    spec:
      containers:
        - name: hello-world
          image: docker-adder
          args:
            - "2"
            - "1"
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
